<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="text-scale" content="scale" />
  <meta
    name="description"
    content="This is my ama-bot, a simple web application that allows you to get to know me better by asking questions."
  />
  <meta name="author" content="Julie" />
  <meta name="color" />
  <title>AMA-Bot</title>
  <script src="app.js" defer></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="canonical" href="https://www.ama-bot.com/" />

  <head>
    <link rel="stylesheet" href="./index.css" />
  </head>
  <body>
    <header>
      <h1>my ama-bot</h1>
      <h2>Stil botten spørgsmål og lær mig bedere at kende</h2>
    </header>
    <main>
      <section class="grid-container">
       
          <div class="message-container" id="messages">
            <article class="bubble">
              <p></p>
            </article>
            <time></time>
          </div>
       
        <section class="input-form">
          <form method="post" action="/ask" id="question-form">
            <article class="message">
              <label for="question">Ask a question:</label>
              <input
                type="text"
                name="question"
                id="question"
                placeholder="Type your question here"
                required >
              </input>
            </article>
            <button type="submit">Submit</button>
          </form>
          <form method="POST" action="/clear-messages-button">
            <button type="button" id="clear-messages-button">Ryd beskeder</button>
          </form>
          <form method="POST" action="/clear-stats-button">
            <button type="button" id="clear-stats-button">Nulstil statistik</button>
          </form>
        </section>
        <!-- <section>
          <h2>Spørgsmål fordelt på emner</h2>
          
            <p>Mest spurgte emne: </p>
        
            <ul>
              
                <li></li>
             
            </ul>
        </section> -->
      </section>
    </main>
  </body>
</html>
