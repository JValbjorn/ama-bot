<!doctype html>
<html lang="en">
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="text-scale" content="scale" />
  <meta
    name="description"
    content="This is my ama-bot, a simple web application that allows you to get to know me better by asking questions."
  />
  <meta name="author" content="Julie" />
  <meta name="color" />
  <title>AMA-Bot</title>
  <script src="index.js" defer></script>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <link rel="canonical" href="https://www.ama-bot.com/" />

  <head>
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header>
      <h1>my ama-bot</h1>
      <h2>Stil botten et spørgsmål og lær mig bedere at kende</h2>
    </header>
    <main>
      <section class="grid-container">
        <article class="question">
          <p>Hi</p>
        </article>
        <article class="answer">
          <p>Hello, how can I help you?</p>
        </article>
        <section class="input-form">
           <form>
          <article class="message">
            <!-- <label for="question">Ask a question:</label> -->
            <input
              type="text"
              name="question"
              id="question"
              placeholder="Type your question here"
              required
            />
          </article>
          <button type="submit">Submit</button>
        </form> 
        </section>
      </section>
    </main>
  </body>
</html>
